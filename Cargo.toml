[package]
name = "pico-std"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["stdio-usb"]
stdio-uart = []
stdio-usb = []
stdio-semihosting = []
rp235x-hal = ["dep:rp235x-hal"]
usb-smoke = []
rtos-smoke = []
wifi = []

[dependencies]
embedded-hal = "1"
# Peripheral access for the RP2350. We don't use rp235x-hal's `rt` (cortex-m-rt)
# runtime — the Pico SDK provides crt0 and the vector table — so disable default
# features and keep only the critical-section implementation.
rp235x-hal = { version = "0.4", optional = true, default-features = false, features = ["critical-section-impl"] }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"

[build-dependencies]
cmake = "0.1.50"
embuild = { version = "0.31.1", features = ["cmake"] }

[[example]]
name = "threads"
crate-type = ["bin"]

[[example]]
name = "blinky"
crate-type = ["bin"]
required-features = ["rp235x-hal"]

[[example]]
name = "hello"
crate-type = ["bin"]

[[example]]
name = "wifi"
crate-type = ["bin"]
required-features = ["wifi"]
