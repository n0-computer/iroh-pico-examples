[package]
name = "pico-std"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["stdio-usb"]
stdio-uart = []
stdio-usb = []
stdio-semihosting = []
rp235x-hal = ["dep:rp235x-hal"]
usb-smoke = []
rtos-smoke = []
wifi = []
display = []
psram = []
psram-heap = ["psram"]
iroh = [
    "wifi",
    "dep:aes",
    "dep:aes-gcm",
    "dep:iroh",
    "dep:iroh-tickets",
    "dep:rustls",
    "dep:rustls-rustcrypto",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]
iroh-psram = ["iroh", "psram-heap"]
iroh-full = ["iroh", "psram-heap"]

[dependencies]
embedded-hal = "1"
# Peripheral access for the RP2350. We don't use rp235x-hal's `rt` (cortex-m-rt)
# runtime — the Pico SDK provides crt0 and the vector table — so disable default
# features and keep only the critical-section implementation.
rp235x-hal = { version = "0.4", optional = true, default-features = false, features = ["critical-section-impl"] }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
iroh = { version = "1.0.2", optional = true, default-features = false }
iroh-tickets = { version = "1.0.0", optional = true }
rustls = { version = "0.23", optional = true, default-features = false }
rustls-rustcrypto = { git = "https://github.com/n0-computer/rustls-rustcrypto", branch = "feature-flag-algorithms-v0.0.2", optional = true, default-features = false, features = ["std"] }
tokio = { version = "1", optional = true, features = ["io-util", "rt", "time"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt"] }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"

[build-dependencies]
cmake = "0.1.50"
embuild = { version = "0.31.1", features = ["cmake"] }

[[example]]
name = "threads"
crate-type = ["bin"]

[[example]]
name = "blinky"
crate-type = ["bin"]
required-features = ["rp235x-hal"]

[[example]]
name = "hello"
crate-type = ["bin"]

[[example]]
name = "wifi"
crate-type = ["bin"]
required-features = ["wifi"]

[[example]]
name = "iroh-echo"
crate-type = ["bin"]
required-features = ["iroh"]

[[example]]
name = "iroh-echo-full"
crate-type = ["bin"]
required-features = ["iroh-full"]

[[example]]
name = "iroh-echo-psram"
crate-type = ["bin"]
required-features = ["iroh-psram"]

[[example]]
name = "display"
crate-type = ["bin"]
required-features = ["display"]

[[example]]
name = "psram"
crate-type = ["bin"]
required-features = ["psram"]
