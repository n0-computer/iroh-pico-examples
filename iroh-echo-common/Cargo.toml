[package]
name = "iroh-echo-common"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
relay = ["rustls-rustcrypto/p256"]

[dependencies]
pico-std = { path = "../pico-std", default-features = false, features = [
    "app-stack-64k",
    "stdio-usb",
    "wifi",
] }
aes = "0.8"
aes-gcm = "0.10"
iroh = { version = "1.0.2", default-features = false }
iroh-relay = { version = "1.0.2", default-features = false }
iroh-tickets = "1.0.0"
n0-error = "1"
n0-future = "0.3"
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = { git = "https://github.com/n0-computer/rustls-rustcrypto", branch = "feature-flag-algorithms-v0.0.2", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
